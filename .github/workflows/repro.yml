name: CI build waste repro (delta)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delta:
    strategy:
      fail-fast: false
      matrix:
        variant:
        - before
        - after
        mode:
        - untraced
        - traced
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Runner hardware
      run: nproc; free -g | head -2; lscpu | grep -E 'Model name|Thread|Core|Socket'
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu
    - name: Cache dependencies
      if: matrix.variant == 'after'
      uses: Swatinem/rust-cache@v2
      with:
        key: x86_64-unknown-linux-gnu
    - name: Build (untraced, timed)
      if: matrix.mode == 'untraced'
      shell: bash
      run: cargo test --target x86_64-unknown-linux-gnu --verbose --no-run
    - uses: LalitMaganti/buildprof@v0.2.8
      with:
        artifact-name: delta-${{ matrix.variant }}-${{ github.run_attempt }}-${{ matrix.mode }}
        command: cargo test --target x86_64-unknown-linux-gnu --verbose --no-run
      if: matrix.mode == 'traced'
